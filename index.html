<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196F3">
    <title>مرسل الديون - صيدلية العابد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e5799 0%, #2b8c5e 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: 24px; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1e5799; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-sms { background: #2196F3; color: white; }
        .btn-update { background: #17a2b8; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #ddd; font-size: 13px; }
        th { background: #f0f0f0; }
        input { padding: 5px; text-align: center; border-radius: 6px; border: 1px solid #ddd; width: 80px; }
        .footer { text-align: center; margin-top: 20px; color: white; font-size: 11px; opacity: 0.7; }
        .info-note { background: #FFF3E0; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 12px; color: #E65100; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 صيدلية العابد</h1>
            <p>نظام إدارة وإرسال الديون</p>
        </div>
        
        <div class="card">
            <div class="card-title">👥 العملاء والحركة اليومية</div>
            
            <div id="customersTable"></div>
            
            <div class="info-note">
                📌 كل يوم: أدخل "فاتورة جديدة" أو "سداد" ثم اضغط "تحديث"<br>
                📌 ثم اضغط 📱 واتساب أو ✉️ رسالة للإرسال<br>
                📌 أرقام الهواتف مدخلة مسبقاً من ملف Excel الذي أرسلته
            </div>
        </div>
        
        <div class="footer">نظام مرسل الديون | صيدلية العابد</div>
    </div>

    <script>
        // ========================================
        // البيانات ثابتة من ملف Excel الذي أرسلته
        // الأرصدة من ملف PDF (كشف الحساب)
        // ========================================
        
        let customers = [
            { id: 6, name: "عبدالله المروسي", phone: "711258371", debt: 0, paid: 0, totalDebt: 435340.07 },
            { id: 12, name: "عبدالله الحكيمي", phone: "735574604", debt: 0, paid: 0, totalDebt: 2950.20 },
            { id: 51, name: "ناصر العتمي", phone: "736379838", debt: 0, paid: 0, totalDebt: 22886.00 },
            { id: 63, name: "وليد الزماني", phone: "777614827", debt: 0, paid: 0, totalDebt: 12875.40 },
            { id: 93, name: "عبدالله شيبان", phone: "777458368", debt: 0, paid: 0, totalDebt: 184755.11 },
            { id: 110, name: "حسن الطباخ", phone: "770370211", debt: 0, paid: 0, totalDebt: 8810.00 },
            { id: 146, name: "لطف محمد قاسم", phone: "777206743", debt: 0, paid: 0, totalDebt: 98044.21 },
            { id: 228, name: "ام براءه", phone: "735718544", debt: 0, paid: 0, totalDebt: 7468.98 },
            { id: 311, name: "ام محمد ضمانة اختيار", phone: "774923011", debt: 0, paid: 0, totalDebt: 19892.00 },
            { id: 315, name: "محمد نجيب صاحب البطاط", phone: "733736264", debt: 0, paid: 0, totalDebt: 69002.00 },
            { id: 322, name: "مروان سيف", phone: "730329017", debt: 0, paid: 0, totalDebt: 200.00 }
        ];

        // تحميل البيانات المحفوظة (الحركة اليومية فقط)
        function loadData() {
            const saved = localStorage.getItem('alabed_fixed');
            if (saved) {
                const savedData = JSON.parse(saved);
                customers.forEach(c => {
                    const found = savedData.find(s => s.id === c.id);
                    if (found) {
                        c.debt = found.debt || 0;
                        c.paid = found.paid || 0;
                    }
                });
            }
            renderTable();
        }

        function saveData() {
            const toSave = customers.map(c => ({ id: c.id, debt: c.debt, paid: c.paid }));
            localStorage.setItem('alabed_fixed', JSON.stringify(toSave));
        }

        function resetAllMovements() {
            if (confirm('⚠️ هل تريد إعادة تعيين الحركة اليومية لجميع العملاء؟')) {
                customers.forEach(c => {
                    c.debt = 0;
                    c.paid = 0;
                });
                saveData();
                renderTable();
                alert('✅ تم إعادة تعيين الحركة اليومية');
            }
        }

        function updateCustomer(index) {
            const debtInput = document.getElementById(`debt_${index}`);
            const paidInput = document.getElementById(`paid_${index}`);
            
            customers[index].debt = parseFloat(debtInput.value) || 0;
            customers[index].paid = parseFloat(paidInput.value) || 0;
            
            saveData();
            renderTable();
            alert(`✅ تم تحديث حركة ${customers[index].name}`);
        }

        function calculateNewTotal(customer) {
            let newTotal = customer.totalDebt;
            if (customer.debt > 0) newTotal += customer.debt;
            if (customer.paid > 0) newTotal -= customer.paid;
            return newTotal;
        }

        function createMessage(customer, newTotal) {
            let text = '';
            if (customer.debt > 0 && customer.paid > 0) {
                text = `تم تقيد مبلغ ${customer.debt.toLocaleString()} ريال (فاتورة جديدة) وتم استلام مبلغ ${customer.paid.toLocaleString()} ريال (سداد)`;
            } else if (customer.debt > 0) {
                text = `تم تقيد مبلغ ${customer.debt.toLocaleString()} ريال (فاتورة جديدة)`;
            } else if (customer.paid > 0) {
                text = `تم استلام مبلغ ${customer.paid.toLocaleString()} ريال (سداد)`;
            } else {
                alert('⚠️ لا توجد حركة يومية لهذا العميل');
                return null;
            }
            
            return `الاخ ${customer.name}، نود اعلامكم بان ${text} ليصبح اجمالي الرصيد عليكم ${newTotal.toLocaleString()} ريال.

يرجى السداد بداية ونهاية كل شهر

🏥 صيدلية العابد
تعز - الحوبان - مدخل البريد
📞 770066128`;
        }

        function sendToWhatsApp(index) {
            const customer = customers[index];
            if (customer.debt === 0 && customer.paid === 0) {
                alert('⚠️ لا توجد حركة يومية لهذا العميل');
                return;
            }
            
            const newTotal = calculateNewTotal(customer);
            const message = createMessage(customer, newTotal);
            if (!message) return;
            
            // تحديث الرصيد بعد الإرسال
            customer.totalDebt = newTotal;
            customer.debt = 0;
            customer.paid = 0;
            saveData();
            renderTable();
            
            let phone = customer.phone.toString().replace(/^0+/, '').replace(/^967/, '');
            window.open(`https://wa.me/967${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function sendToSMS(index) {
            const customer = customers[index];
            if (customer.debt === 0 && customer.paid === 0) {
                alert('⚠️ لا توجد حركة يومية لهذا العميل');
                return;
            }
            
            const newTotal = calculateNewTotal(customer);
            const message = createMessage(customer, newTotal);
            if (!message) return;
            
            customer.totalDebt = newTotal;
            customer.debt = 0;
            customer.paid = 0;
            saveData();
            renderTable();
            
            let phone = customer.phone.toString().replace(/^0+/, '').replace(/^967/, '');
            window.location.href = `sms:+967${phone}?body=${encodeURIComponent(message)}`;
        }

        function renderTable() {
            const container = document.getElementById('customersTable');
            
            let html = `能
                <thead>
                    <tr>
                        <th>#</th>
                        <th>العميل</th>
                        <th>رقم الجوال</th>
                        <th>الرصيد الحالي</th>
                        <th>فاتورة جديدة</th>
                        <th>سداد</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>`;
            
            for (let i = 0; i < customers.length; i++) {
                const c = customers[i];
                const hasMovement = c.debt > 0 || c.paid > 0;
                html += `
                    <tr style="${hasMovement ? 'background: #fff8e1;' : ''}">
                        <tr>${c.id}</td>
                        <td style="text-align: right;"><strong>${c.name}</strong></td>
                        <td>${c.phone}</td>
                        <td style="color: #2b8c5e; font-weight: bold;">${c.totalDebt.toLocaleString()} </td>
                        <td><input type="number" id="debt_${i}" value="${c.debt}" placeholder="0" step="any" style="width: 80px; border-color: #e74c3c;"></td>
                        <td><input type="number" id="paid_${i}" value="${c.paid}" placeholder="0" step="any" style="width: 80px; border-color: #27ae60;"></td>
                        <td>
                            <button onclick="updateCustomer(${i})" style="background:#17a2b8; color:white; border:none; padding:5px 8px; border-radius:5px; margin:2px;" title="تحديث">💾</button>
                            <button onclick="sendToWhatsApp(${i})" style="background:#25D366; color:white; border:none; padding:5px 8px; border-radius:5px; margin:2px;" title="واتساب">📱</button>
                            <button onclick="sendToSMS(${i})" style="background:#2196F3; color:white; border:none; padding:5px 8px; border-radius:5px; margin:2px;" title="رسالة">✉️</button>
                        </td>
                    </tr>
                `;
            }
            
            html += `</tbody>
            </table>
            <div style="margin-top: 15px;">
                <button class="btn btn-update" onclick="resetAllMovements()" style="background:#6c757d;">🔄 إعادة تعيين الحركة اليومية للجميع</button>
            </div>`;
            
            container.innerHTML = html;
        }

        // جعل الدوال عامة
        window.updateCustomer = updateCustomer;
        window.sendToWhatsApp = sendToWhatsApp;
        window.sendToSMS = sendToSMS;
        window.resetAllMovements = resetAllMovements;
        
        // تحميل البيانات
        loadData();
    </script>
</body>
</html>
