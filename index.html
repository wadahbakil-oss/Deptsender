<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2196F3">
    <title>مرسل الديون</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📱 مرسل الديون</h1>
        
        <div class="card">
            <label>👤 اختر العميل</label>
            <select id="customerSelect"></select>
            
            <div class="current-debt" id="currentDebt">الرصيد الحالي: 0 ريال</div>
            
            <label>💰 المبلغ الجديد المقيد</label>
            <input type="number" id="amountInput" placeholder="أدخل المبلغ" step="0.01">
            
            <div class="button-group">
                <button class="btn-whatsapp" onclick="sendViaWhatsApp()">
                    📱 إرسال عبر واتساب
                </button>
                <button class="btn-sms" onclick="sendViaSMS()">
                    ✉️ إرسال عبر رسالة نصية
                </button>
            </div>
            
            <button class="btn-pdf" onclick="attachPDF()">
                📎 إرفاق فاتورة PDF
            </button>
            
            <button class="btn-invoice" onclick="generateAndSendPDF()">
                📄 إنشاء وإرسال فاتورة PDF
            </button>
            
            <button class="btn-add" onclick="addNewCustomer()">
                ➕ إضافة عميل جديد
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
